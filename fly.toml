# fly.toml app configuration file generated for bedrock-voice-chat on 2026-11-01T17:27:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bedrock-voice-chat'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 20063
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
